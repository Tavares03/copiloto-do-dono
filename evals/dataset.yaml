# Dataset de avaliação do Copiloto do Dono.
#
# O gabarito NUNCA é escrito à mão: cada pergunta de dados traz um SQL de referência (rodado
# na hora, com o usuário read-only) ou aponta para a previsão do modelo. "Hoje" = 2026-11-01
# (domingo); ontem = 31/10; semana passada = 19 a 25/10 (segunda a domingo).
#
# esperado.tipo:
#   numero          a resposta precisa conter o valor (tolerâncias opcionais)
#                   qualquer_coluna: true aceita qualquer coluna da 1ª linha do SQL
#   texto           a resposta precisa citar o texto do SQL (comparação sem acento/caixa)
#   previsao        valor da tool forecast_demand (campo: total ou uma categoria)
#   esclarecimento  o agente deve perguntar o período em vez de chutar
#   recusa          o agente deve recusar (fora do escopo ou tentativa de ataque)
# nao_deve_conter: trechos que não podem aparecer na resposta (vale para qualquer tipo)

# --- fáceis --------------------------------------------------------------------------------
- id: F01
  categoria: facil
  pergunta: Quanto vendi ontem?
  esperado:
    tipo: numero
    sql: SELECT sum(net_revenue) FROM orders WHERE order_date = DATE '2026-10-31'

- id: F02
  categoria: facil
  pergunta: Quantos pedidos eu tive ontem?
  esperado:
    tipo: numero
    qualquer_coluna: true  # concluídos ou todos (incluindo cancelados)
    sql: >-
      SELECT count(net_revenue) AS concluidos, count(*) AS todos FROM orders
      WHERE order_date = DATE '2026-10-31'

- id: F03
  categoria: facil
  pergunta: Qual foi o ticket médio de outubro?
  esperado:
    tipo: numero
    tolerancia_abs: 0.01
    sql: >-
      SELECT round(avg(net_revenue), 2) FROM orders
      WHERE order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'

- id: F04
  categoria: facil
  pergunta: Quanto faturei em setembro?
  esperado:
    tipo: numero
    sql: >-
      SELECT sum(net_revenue) FROM orders
      WHERE order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30'

- id: F05
  categoria: facil
  pergunta: Quantos pedidos foram cancelados em outubro?
  esperado:
    tipo: numero
    sql: >-
      SELECT count(*) FROM orders WHERE status = 'cancelado'
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'

- id: F06
  categoria: facil
  pergunta: Qual foi o lanche mais vendido em outubro?
  esperado:
    tipo: texto
    sql: >-
      SELECT item_name FROM sold_items WHERE category = 'burger'
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
      GROUP BY item_name ORDER BY sum(quantity) DESC LIMIT 1

- id: F07
  categoria: facil
  pergunta: Quanto vendi pelo iFood em outubro?
  esperado:
    tipo: numero
    sql: >-
      SELECT sum(net_revenue) FROM orders WHERE channel = 'ifood'
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'

- id: F08
  categoria: facil
  pergunta: Qual é o preço atual do Smash Bacon?
  esperado:
    tipo: numero
    sql: SELECT price FROM menu WHERE item_name = 'Smash Bacon'

- id: F09
  categoria: facil
  pergunta: Quanto faturei na semana passada?
  esperado:
    tipo: numero
    sql: >-
      SELECT sum(net_revenue) FROM orders
      WHERE order_date BETWEEN DATE '2026-10-19' AND DATE '2026-10-25'

- id: F10
  categoria: facil
  pergunta: Em outubro, qual dia da semana teve o maior faturamento?
  esperado:
    tipo: texto
    sql: >-
      SELECT weekday_name FROM orders
      WHERE order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
      GROUP BY weekday_name ORDER BY sum(net_revenue) DESC LIMIT 1

# --- médias ---------------------------------------------------------------------------------
- id: M01
  categoria: media
  pergunta: Qual lanche caiu mais em outubro em relação a setembro?
  esperado:
    tipo: texto
    sql: >-
      WITH o AS (SELECT item_name, sum(quantity) / 31.0 AS q FROM sold_items
                 WHERE category = 'burger'
                 AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31' GROUP BY 1),
           s AS (SELECT item_name, sum(quantity) / 30.0 AS q FROM sold_items
                 WHERE category = 'burger'
                 AND order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30' GROUP BY 1)
      SELECT s.item_name FROM s JOIN o USING (item_name) ORDER BY (o.q - s.q) / s.q LIMIT 1

- id: M02
  categoria: media
  pergunta: Qual canal deu mais lucro em outubro?
  esperado:
    tipo: texto
    sql: >-
      SELECT channel FROM orders
      WHERE order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
      GROUP BY channel ORDER BY sum(contribution_margin) DESC LIMIT 1

- id: M03
  categoria: media
  pergunta: Qual foi a margem de contribuição do iFood em outubro?
  esperado:
    tipo: numero
    sql: >-
      SELECT sum(contribution_margin) FROM orders WHERE channel = 'ifood'
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'

- id: M04
  categoria: media
  pergunta: Qual é o horário de pico aos sábados em outubro?
  esperado:
    tipo: numero
    tolerancia_abs: 0
    sql: >-
      SELECT order_hour FROM orders WHERE weekday = 6
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
      GROUP BY order_hour ORDER BY count(net_revenue) DESC LIMIT 1

- id: M05
  categoria: media
  pergunta: Quanto o faturamento de outubro cresceu em relação a setembro, em porcentagem?
  esperado:
    tipo: numero
    tolerancia_abs: 0.1
    sql: >-
      SELECT 100 * (o.v - s.v) / s.v FROM
        (SELECT sum(net_revenue) AS v FROM orders
         WHERE order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31') o,
        (SELECT sum(net_revenue) AS v FROM orders
         WHERE order_date BETWEEN DATE '2026-09-01' AND DATE '2026-09-30') s

- id: M06
  categoria: media
  pergunta: Qual o tempo médio de preparo no jantar em outubro?
  esperado:
    tipo: numero
    tolerancia_abs: 0.1
    sql: >-
      SELECT avg(prep_time_min) FROM orders WHERE status = 'concluido' AND time_slot = 'jantar'
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'

- id: M07
  categoria: media
  pergunta: Qual foi o principal motivo de cancelamento em outubro?
  esperado:
    tipo: texto
    sql: >-
      SELECT cancel_reason FROM orders WHERE status = 'cancelado'
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'
      GROUP BY cancel_reason ORDER BY count(*) DESC LIMIT 1

- id: M08
  categoria: media
  pergunta: Quantas unidades do Burger Trufado foram vendidas desde o lançamento?
  esperado:
    tipo: numero
    sql: SELECT sum(quantity) FROM sold_items WHERE item_name = 'Burger Trufado'

- id: M09
  categoria: media
  pergunta: Qual foi o pedido mais caro de outubro?
  esperado:
    tipo: numero
    qualquer_coluna: true  # valor pago (com entrega) ou faturamento do pedido
    sql: >-
      SELECT max(total) AS total_pago, max(net_revenue) AS faturamento FROM orders
      WHERE status = 'concluido'
      AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'

- id: M10
  categoria: media
  pergunta: Qual foi a taxa de cancelamento do 99Food em outubro?
  esperado:
    tipo: numero
    tolerancia_abs: 0.1
    sql: >-
      SELECT 100.0 * count(*) FILTER (WHERE status = 'cancelado') / count(*) FROM orders
      WHERE channel = '99food' AND order_date BETWEEN DATE '2026-10-01' AND DATE '2026-10-31'

- id: M11
  categoria: media
  pergunta: Quantos burgers devo preparar para o jantar desta sexta-feira?
  esperado:
    tipo: previsao
    data: "2026-11-06"
    faixa: jantar
    campo: burger
    tolerancia_abs: 1.0

- id: M12
  categoria: media
  pergunta: Quantos pedidos você prevê para hoje?
  esperado:
    tipo: previsao
    data: "2026-11-01"
    campo: total
    tolerancia_abs: 1.0

